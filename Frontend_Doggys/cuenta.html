<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi cuenta - Doggy's</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >
</head>

<body>

    <header class="header">
        <div class="contenedor header-contenido">

            <a href="index.html" class="logo">
                DOGGY'S
            </a>

            <div class="header-iconos">

                <a href="cuenta.html" class="icono-header">
                    <i class="fa-regular fa-user"></i>
                </a>

                <a href="productos.html" class="icono-header">
                    <i class="fa-solid fa-bag-shopping"></i>
                </a>

            </div>

        </div>
    </header>


    <main class="cuenta">

        <div class="contenedor cuenta-contenido">

            <div class="cuenta-card">

                <p class="hero-superior">
                    MI CUENTA
                </p>

                <h1>
                    Iniciar sesión
                </h1>

                <p class="cuenta-descripcion">
                    Ingresa tus datos para acceder a tu cuenta Doggy's.
                </p>


                <form id="formLogin">

                    <div class="campo">

                        <label for="correo">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correo"
                            placeholder="correo@ejemplo.com"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn-principal btn-login"
                    >
                        Iniciar sesión
                    </button>

                </form>


                <p
                    id="mensajeLogin"
                    class="mensaje-login"
                >
                </p>


                <div class="volver-cuenta">

                    <a href="index.html">
                        <i class="fa-solid fa-arrow-left"></i>
                        Volver al inicio
                    </a>

                </div>

            </div>

        </div>

    </main>


    <footer class="footer">

        <div class="contenedor footer-grid">

            <div class="footer-marca">

                <h2>
                    DOGGY'S
                </h2>

                <p>
                    Comida rica para cualquier bajón.
                </p>

            </div>


            <div class="footer-columna">

                <h3>
                    CONÓCENOS
                </h3>

                <a href="#">
                    Nosotros
                </a>

                <a href="#">
                    Trabaja con nosotros
                </a>

            </div>


            <div class="footer-columna">

                <h3>
                    REDES SOCIALES
                </h3>

                <a href="#">
                    Instagram
                </a>

                <a href="#">
                    TikTok
                </a>

            </div>


            <div class="footer-columna">

                <h3>
                    MI CUENTA
                </h3>

                <a href="productos.html">
                    Pedir
                </a>

                <a href="cuenta.html">
                    Iniciar sesión
                </a>
            </div>
        </div>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
